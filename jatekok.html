<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Játékok – Kódfejtő Műhely</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="assets/common.css">
<style>
  .hero { display: flex; flex-direction: column; gap: 10px; }
  .hero .kicker { font-weight: 800; color: var(--blue); }
  .hero h1 { font-size: 44px; }
  .hero p { margin: 0; font-size: 19px; max-width: 780px; }
  .gamelist { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
  .gcard { text-decoration: none; color: var(--ink); display: flex; gap: 18px; align-items: center; }
  .gcard .ico { flex: none; width: 92px; height: 92px; border-radius: 24px; display: flex; align-items: center; justify-content: center; font-size: 50px; }
  .gcard h2 { font-size: 26px; }
  .gcard p { margin: 4px 0 0; color: var(--muted); }
  .gcard .best { font-weight: 800; color: var(--green-d); font-size: 14.5px; margin-top: 6px; display: block; }
  .gcard.soon { opacity: .6; }
  .game { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 24px; align-items: start; }
  .panel { display: flex; flex-direction: column; gap: 14px; }
  .topline { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; }
  .topline h1 { font-size: 34px; }
  .stats { display: flex; gap: 10px; flex-wrap: wrap; }
  .stat { background: var(--sky); border-radius: 12px; padding: 6px 14px; font-weight: 800; }
  .seg { display: inline-flex; background: var(--sky); border-radius: 14px; padding: 4px; gap: 4px; }
  .seg button { border: 0; background: none; min-height: 40px; padding: 0 14px; border-radius: 10px; font: inherit; font-weight: 800; font-size: 15px; color: var(--muted); cursor: pointer; }
  .seg button.on { background: var(--white); color: var(--ink); box-shadow: 0 2px 0 var(--line); }
  pre.code { margin: 0; background: #14203A; color: #E6EDF7; border-radius: 14px; padding: 16px 18px; font-family: 'JetBrains Mono', monospace; font-size: 16px; line-height: 1.7; }
  .bstack { display: flex; flex-direction: column; gap: 3px; }
  .blk { align-self: flex-start; color: #fff; font-weight: 800; font-size: 15.5px; padding: 10px 16px; border-radius: 8px; }
  .blk.events { background: #FFBF00; color: #1D2B44; border-radius: 20px 20px 8px 8px; }
  .blk.movement { background: #E0459B; } .blk.control { background: #E3A008; }
  .task { font-size: 18px; margin: 0; }
  .msg { font-weight: 800; font-size: 18px; min-height: 28px; }
  .msg.ok { color: var(--green-d); } .msg.err { color: var(--red-d); }
  .heads { display: flex; gap: 8px; }
  .heads button { width: 54px; height: 54px; border-radius: 14px; border: 3px solid var(--line); background: var(--white); font-size: 26px; cursor: pointer; }
  .heads button.on { border-color: var(--blue); background: #F2F7FF; }
  svg.board { width: 100%; height: auto; background: var(--white); border-radius: 20px; border-bottom: 6px solid var(--line); touch-action: manipulation; }
  .cellhit { cursor: pointer; }
  .cellhit:hover { fill: rgba(47,111,237,.12); }
  .numin { font: inherit; font-size: 28px; font-weight: 800; width: 140px; border: 3px solid var(--line); border-radius: 14px; padding: 6px 12px; text-align: center; }
  .numin:focus { outline: none; border-color: var(--blue); }
  .endbox { text-align: center; display: flex; flex-direction: column; gap: 12px; align-items: center; }
  .endbox .big { font-family: 'Baloo 2', sans-serif; font-size: 64px; line-height: 1; }
  @media (max-width: 1000px) { .game, .gamelist { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header id="siteHeader"></header>
<main class="page" id="app"></main>
<footer id="siteFooter"></footer>
<script src="assets/config.js"></script>
<script src="assets/cloud.js"></script>
<script src="assets/common.js"></script>
<script src="assets/games.js"></script>
</body>
</html>
