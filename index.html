<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Matek 7 – kaland (kipróbálós verzió)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Orbitron:wght@500;800&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1c2a22; --bg2:#253629; --panel:#f3e9d2; --ink:#2b2218; --muted:#6b5b45;
  --accent:#b8862b; --accent2:#7a3e1d; --ok:#2f7d32; --bad:#b3362b; --line:#d8c7a3;
  --head:'Cinzel', Georgia, serif; --radius:14px; --glow:none;
}
body.scifi{
  --bg:#070b1a; --bg2:#0f1733; --panel:#111a36; --ink:#e6f1ff; --muted:#8fa3c7;
  --accent:#3fe0d0; --accent2:#8a6bff; --ok:#3ee07f; --bad:#ff5a7a; --line:#243259;
  --head:'Orbitron', 'Segoe UI', sans-serif; --radius:6px; --glow:0 0 18px rgba(63,224,208,.25);
}
*{box-sizing:border-box}
body{margin:0;font-family:'Nunito',system-ui,sans-serif;color:var(--ink);
  background:radial-gradient(1200px 600px at 20% -10%,var(--bg2),var(--bg));min-height:100vh;transition:background .4s}
body.scifi{background:
  radial-gradient(2px 2px at 10% 20%,#fff8,transparent),radial-gradient(1px 1px at 70% 30%,#fff9,transparent),
  radial-gradient(1px 1px at 40% 80%,#fff7,transparent),radial-gradient(2px 2px at 85% 65%,#fff6,transparent),
  radial-gradient(1200px 600px at 80% -10%,var(--bg2),var(--bg))}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 20px;color:#fff}
.emblem{width:46px;height:46px;flex:none}
.title{font-family:var(--head);font-size:1.35rem;letter-spacing:.03em}
.title small{display:block;font-family:'Nunito';font-size:.8rem;opacity:.75;letter-spacing:0}
.spacer{flex:1}
.res{display:flex;gap:10px}
.chip{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:6px 12px;font-weight:800;display:flex;align-items:center;gap:6px;white-space:nowrap}
.chip svg{width:18px;height:18px}
.switch{display:flex;background:rgba(255,255,255,.1);border-radius:999px;padding:3px}
.switch button{border:0;background:transparent;color:#fff;padding:6px 12px;border-radius:999px;cursor:pointer;font:inherit;font-weight:700}
.switch button.on{background:#fff;color:#111}
main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;padding:0 20px 24px;max-width:1180px;margin:0 auto}
@media (max-width:900px){main{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--panel);border-radius:var(--radius);padding:18px 20px;box-shadow:0 10px 30px rgba(0,0,0,.35),var(--glow);border:1px solid var(--line)}
body.fantasy .card{background-image:linear-gradient(180deg,#f7efdc,#efe2c4)}
.story{display:flex;gap:14px;align-items:flex-start}
.story .lvl{font-family:var(--head);font-size:1.1rem;color:var(--accent2)}
body.scifi .story .lvl{color:var(--accent)}
.story p{margin:.3rem 0 0;color:var(--muted)}
.track{display:flex;gap:8px;margin:14px 0 4px}
.step{flex:1;text-align:center;padding:8px 4px;border-radius:10px;border:2px solid var(--line);font-weight:800;font-size:.85rem;color:var(--muted);position:relative}
.step.done{border-color:var(--accent);color:var(--accent)}
.step.cur{background:var(--accent);border-color:var(--accent);color:#fff}
body.scifi .step.cur{color:#04121a}
.step .rw{display:block;font-weight:600;font-size:.72rem;opacity:.85}
.meters{display:flex;gap:22px;flex-wrap:wrap;margin:10px 0 0;font-size:.85rem;color:var(--muted)}
.dots{display:inline-flex;gap:5px;vertical-align:middle;margin-left:6px}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--line)}
.dot.g{background:var(--ok);border-color:var(--ok)}
.dot.r{background:var(--bad);border-color:var(--bad)}
.task{margin-top:16px}
.qlabel{font-size:.9rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.expr{font-size:1.75rem;margin:10px 0 6px;line-height:1.5;word-spacing:.08em}
@media (max-width:600px){.expr{font-size:1.3rem}}
.expr i{font-family:Georgia,'Times New Roman',serif;font-weight:600}
.subst{font-size:1.15rem;margin:4px 0 0}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.8em;line-height:1.05;margin:0 2px}
.frac>span:first-child{border-bottom:1.5px solid currentColor;padding:0 2px}
.answer{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.answer input{flex:1;min-width:200px;font-size:1.35rem;padding:10px 14px;border-radius:10px;border:2px solid var(--line);background:rgba(255,255,255,.75);color:#111;font-family:Georgia,serif}
body.scifi .answer input{background:#0a1128;color:var(--ink);border-color:var(--line)}
.answer input:focus{outline:none;border-color:var(--accent)}
.btn{border:0;border-radius:10px;padding:10px 18px;font:inherit;font-weight:800;cursor:pointer;background:var(--accent);color:#fff;font-size:1rem}
body.scifi .btn{color:#04121a}
body.scifi .btn.ghost{color:var(--accent)}
.btn.ghost{background:transparent;border:2px solid var(--accent);color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.kp{display:none;margin-top:12px;max-width:420px}
.kp.show{display:block}
.kp .row{display:grid;gap:6px;margin-bottom:6px}
.kp button{padding:12px 0;font-size:1.15rem;border-radius:8px;border:1px solid var(--line);background:rgba(255,255,255,.6);color:var(--ink);font-family:Georgia,serif;cursor:pointer}
body.scifi .kp button{background:#0a1128}
.kp button.l{font-style:italic;font-weight:700;color:var(--accent2)}
body.scifi .kp button.l{color:var(--accent)}
.fb{margin-top:14px;padding:12px 14px;border-radius:10px;display:none;line-height:1.45}
.fb.show{display:block}
.fb.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);border:1px solid var(--ok)}
.fb.bad{background:color-mix(in srgb,var(--bad) 13%,transparent);border:1px solid var(--bad)}
.fb.info{background:color-mix(in srgb,var(--accent) 14%,transparent);border:1px solid var(--accent)}
.fb b.big{font-family:var(--head);font-size:1.05rem}
.g0{color:#1f6fb2;font-weight:800}.g1{color:#b5361f;font-weight:800}.g2{color:#2f7d32;font-weight:800}.g3{color:#8a3ab9;font-weight:800}.g4{color:#a06a00;font-weight:800}
body.scifi .g0{color:#5fb8ff}body.scifi .g1{color:#ff7a5c}body.scifi .g2{color:#5ef08f}body.scifi .g3{color:#c69bff}body.scifi .g4{color:#ffd166}
.banner{margin-top:12px;padding:12px 14px;border-radius:10px;background:var(--accent2);color:#fff;font-weight:800;display:none}
.banner.show{display:block}
aside h3{font-family:var(--head);margin:0 0 6px;font-size:1rem}
aside .note{font-size:.8rem;color:var(--muted);margin:0 0 10px}
table{width:100%;border-collapse:collapse;font-size:.78rem}
th,td{text-align:left;padding:5px 4px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:700}
td.okc{color:var(--ok);font-weight:800}td.badc{color:var(--bad);font-weight:800}
.rules{margin-top:16px;font-size:.82rem;color:var(--muted)}
.rules li{margin:3px 0}
.toprow{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.tiny{font-size:.78rem;color:var(--muted)}
.pop{animation:pop .5s}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}

.tabs{display:flex;gap:6px;padding:0 20px 14px;max-width:1180px;margin:0 auto;flex-wrap:wrap}
.tabs button{border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;font:inherit;font-weight:800;padding:8px 16px;border-radius:999px;cursor:pointer}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
body.scifi .tabs button.on{color:#04121a}
aside{display:flex;flex-direction:column;gap:18px}
.charrow{display:flex;gap:12px;align-items:center}
.charrow svg{width:84px;height:96px;flex:none}
.stat{font-size:.85rem;color:var(--muted);margin:2px 0}
.stat b{color:var(--ink)}
.bar{height:10px;border-radius:6px;background:color-mix(in srgb,var(--muted) 25%,transparent);overflow:hidden;margin:4px 0 2px}
.bar>span{display:block;height:100%;background:var(--accent);transition:width .4s}
.bar.hp>span{background:var(--ok)}
.bar.hp.low>span{background:var(--bad)}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-top:12px}
.pick{border:2px solid var(--line);border-radius:12px;padding:12px;text-align:center;cursor:pointer;background:rgba(255,255,255,.25);color:var(--ink);font:inherit}
body.scifi .pick{background:rgba(255,255,255,.03)}
.pick:hover:not(:disabled){border-color:var(--accent)}
.pick:disabled{opacity:.45;cursor:default}
.pick svg{width:90px;height:90px}
.pick h4{margin:6px 0 2px;font-family:var(--head);font-size:.95rem}
.pick .tiny{display:block}
.grade{display:inline-block;margin-top:6px;padding:2px 10px;border-radius:999px;background:var(--accent2);color:#fff;font-weight:800;font-size:.8rem}
.field{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin-top:8px}
.fighter{text-align:center}
.fighter svg{width:130px;height:130px;max-width:100%}
@media (max-width:600px){.fighter svg{width:90px;height:90px}}
.fighter .name{font-family:var(--head);font-weight:800;font-size:.95rem}
.vs{font-family:var(--head);font-size:1.4rem;color:var(--accent2);font-weight:800}
body.scifi .vs{color:var(--accent)}
.attacks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
@media (max-width:600px){.attacks{grid-template-columns:1fr}}
.atk{border:0;border-radius:10px;padding:10px;font:inherit;cursor:pointer;background:var(--accent);color:#fff;text-align:left}
body.scifi .atk{color:#04121a}
.atk b{display:block;font-family:var(--head)}
.atk span{font-size:.8rem;opacity:.9}
.atk:disabled{opacity:.4;cursor:default}
.atk.t2{background:color-mix(in srgb,var(--accent) 70%,var(--accent2))}
.atk.t3{background:var(--accent2);color:#fff}
.subacts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.flash{animation:flash .5s}
@keyframes flash{0%{filter:none}30%{filter:brightness(2) saturate(0)}100%{filter:none}}
.dmgpop{font-weight:900;font-size:1.1rem;height:1.4rem}
.dmgpop.e{color:var(--bad)}.dmgpop.p{color:var(--bad)}
.shopitem{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:10px}
.shopitem .ic{width:44px;height:44px;flex:none}
.shopitem .grow{flex:1}
.shopitem h4{margin:0;font-family:var(--head);font-size:.95rem}
.badge{font-size:.72rem;padding:2px 8px;border-radius:999px;border:1px solid var(--accent);color:var(--accent);font-weight:800;margin-left:6px}
.hidden{display:none!important}
.introbox{color:var(--muted);margin:.3rem 0 0}
/* ---- falu ---- */
body.fantasy:not(.x) #tabs [data-m=falu]{}
body.scifi #tabs [data-m=falu]{display:none}
body.mode-falu main{grid-template-columns:minmax(0,1fr);max-width:max(900px,calc((100vh - 250px)*1.792 + 40px))}
body.mode-falu aside{display:none}
body.mode-falu main>section.card{padding:0;overflow:hidden;background:#3c5a2c}
.fwrap{position:relative;overflow:auto;-webkit-overflow-scrolling:touch;border-radius:16px}
.falu{position:relative;isolation:isolate;width:100%;aspect-ratio:2000/1116;user-select:none;-webkit-user-select:none}
.falu>img.fmap{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
.fbld{position:absolute;border:0;background:transparent;border-radius:30%;cursor:pointer;padding:0}
.fbld:hover,.fbld:focus-visible{background:radial-gradient(closest-side,rgba(255,240,180,.35),transparent);outline:none}
.flbl{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:6px;white-space:nowrap;background:rgba(250,242,226,.95);color:#3a2a1a;border:2px solid #c8962e;border-radius:999px;padding:5px 12px 5px 6px;font-weight:900;font-size:clamp(.72rem,1.05vw,1rem);box-shadow:0 4px 10px rgba(0,0,0,.35);pointer-events:none;transition:transform .15s;z-index:2000}
.flbl i{font-style:normal;width:1.8em;height:1.8em;display:grid;place-items:center;border-radius:50%;background:#c8962e}
.flbl small{display:block;font-weight:700;font-size:.72em;color:#7a6650;margin-top:-2px}
.flbl.hot,.flbl.hover{transform:translate(-50%,-50%) scale(1.12)}
.flbl.badge:after{content:attr(data-bd);position:absolute;top:-9px;right:-8px;background:#d0453b;color:#fff;border-radius:99px;font-size:.72em;padding:1px 7px}
.fwalker{position:absolute;width:8.5%;aspect-ratio:200/260;transform:translate(-50%,-100%);cursor:pointer}
.fwalker .finner{width:100%;height:100%;transform-origin:50% 100%}
.fwalker.flip .finner{transform:scaleX(-1)}
.fwalker svg{width:100%;height:100%;filter:drop-shadow(0 6px 6px rgba(0,0,0,.35))}
.fme{position:absolute;left:50%;top:-4px;transform:translate(-50%,-100%);background:#c8962e;color:#1b140a;font-weight:900;font-size:clamp(.6rem,.85vw,.82rem);border-radius:99px;padding:2px 9px;white-space:nowrap;box-shadow:0 3px 8px rgba(0,0,0,.3)}
.fwalker:not(.moving):not(.flip) .finner{animation:fidle 3s ease-in-out infinite}
@keyframes fidle{50%{transform:translateY(-1.5%)}}
.ftoast{position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:3000;background:rgba(0,0,0,.72);color:#fff;border-radius:999px;padding:8px 16px;font-weight:800;font-size:.9rem;pointer-events:none}
.fquick{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;padding:8px;background:rgba(20,16,10,.82)}
.fquick button{border:0;background:transparent;color:#fff;border-radius:10px;padding:6px 10px;font-weight:800;font-size:.75rem;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:62px;cursor:pointer;font-family:inherit}
.fquick button b{font-size:1.25rem;line-height:1}
.fquick button:hover{background:rgba(255,255,255,.12)}
.fquick kbd{font-family:inherit;font-size:.6rem;opacity:.6}
/* hős lapja */
.ovcard.hpanel{max-width:1120px;width:100%;text-align:left;padding:0;max-height:92vh;overflow:auto;margin:12px}
.hph{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid rgba(120,90,50,.25);position:sticky;top:0;background:var(--panel);z-index:2}
.hph h2{font-family:var(--head);margin:0;font-size:1.3rem}
.hph .btn{margin-left:auto}
.hgrid{display:grid;grid-template-columns:1fr 240px 1fr;gap:14px;padding:16px 18px;align-items:start}
.hbig{height:330px;position:sticky;top:70px}.hbig svg{width:100%;height:100%}
.hcard{background:rgba(255,255,255,.35);border:1px solid rgba(120,90,50,.2);border-radius:14px;padding:12px 14px}
body.scifi .hcard{background:rgba(255,255,255,.04)}
.hcard+.hcard{margin-top:12px}
.hcard h3{font-family:var(--head);margin:0 0 8px;font-size:1rem}
.hcard .evcard{margin:0}
.hwho{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.hwho b{font-family:var(--head);font-size:1.1rem;display:block}.hwho span{font-size:.82rem;opacity:.75}
.hlvl{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--head);font-weight:800;font-size:1.15rem;background:radial-gradient(circle at 35% 30%,#ffe9a6,#c8962e 70%);color:#3a2408;box-shadow:0 0 0 3px rgba(255,255,255,.6)}
.hstat{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:8px;margin:6px 0;font-size:.85rem}
.hstat .k{font-weight:900}
.hbar{height:10px;border-radius:99px;background:rgba(0,0,0,.12);overflow:hidden}
.hbar i{display:block;height:100%;border-radius:99px}
.hstat.hp .k{color:#d0453b}.hstat.hp i{background:linear-gradient(90deg,#e0574b,#b83228)}
.hstat.ap .k{color:#3b82f6}.hstat.ap i{background:linear-gradient(90deg,#60a5fa,#2563eb)}
.hstat.xp .k{color:#d98a1c}.hstat.xp i{background:linear-gradient(90deg,#f5b544,#d98a1c)}
.hstat.gp .k{color:#b58a1a}
.hnote{font-size:.74rem;opacity:.7;margin:-2px 0 6px 38px}
.hkv{display:flex;justify-content:space-between;font-size:.85rem;padding:5px 0;border-top:1px dashed rgba(120,90,50,.3)}
.hperk{font-size:.82rem;line-height:1.35;background:rgba(200,150,46,.14);border-radius:10px;padding:8px 10px;margin-top:8px}
.hslots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hslot{position:relative;background:rgba(255,255,255,.5);border:2px solid rgba(120,90,50,.25);border-radius:12px;padding:8px 4px 6px;text-align:center;font-size:.72rem;font-weight:800;display:flex;flex-direction:column;align-items:center;gap:3px;font-family:inherit;color:inherit;cursor:pointer}
body.scifi .hslot{background:rgba(255,255,255,.05)}
.hslot .ic{width:44px;height:44px}.hslot .lb{font-weight:600;opacity:.75}
.hslot.on{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent)}
.hslot.empty{opacity:.45;cursor:default;border-style:dashed}
.hslot .tag{position:absolute;top:-8px;right:-6px;background:var(--accent);color:#1b140a;border-radius:99px;padding:1px 7px;font-size:.62rem}
.hbag{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.hcell{aspect-ratio:1;border:2px solid rgba(120,90,50,.25);border-radius:10px;display:grid;place-items:center;position:relative;background:rgba(255,255,255,.4)}
.hcell .ic{width:70%;height:70%}.hcell .n{position:absolute;right:4px;bottom:2px;font-weight:900;font-size:.8rem}
.hcoupon{display:flex;gap:10px;align-items:center;background:rgba(200,150,46,.12);border-radius:10px;padding:8px 10px;margin-top:6px;border-left:4px solid var(--accent)}
.hcoupon .ic{width:32px;height:32px;flex:none}.hcoupon b{display:block;font-size:.86rem}.hcoupon span{font-size:.72rem;opacity:.7}
.hcoupon code{margin-left:auto;font-weight:900;letter-spacing:.12em;border:2px dashed var(--accent);border-radius:6px;padding:2px 6px;font-size:.8rem}
.htro{display:flex;gap:8px;flex-wrap:wrap}
.tro{display:flex;align-items:center;gap:6px;background:rgba(200,150,46,.14);border-radius:99px;padding:4px 10px 4px 4px;font-size:.75rem;font-weight:800}
.tro i{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-style:normal;background:radial-gradient(circle at 35% 30%,#ffe9a6,#c8962e);color:#3a2408}
@media (max-width:900px){
 body.mode-falu main{padding:0 0 70px}
 body.mode-falu main>section.card{border-radius:0}
 .fwrap{height:calc(100vh - 230px);min-height:340px;border-radius:0}
 .falu{width:auto;height:100%}
 .fwalker{width:7.5%}
 .flbl{font-size:.72rem}
 .fquick{display:none}
 .hgrid{grid-template-columns:1fr}.hbig{height:250px;position:static;order:-1}
}

.story-l{font-family:var(--head);font-size:1.1rem;color:var(--accent2)}
body.scifi .story-l{color:var(--accent)}
.mapwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:12px;border-radius:16px}
.map{width:100%;min-width:640px;height:auto;display:block;border-radius:16px}
.node.open{cursor:pointer}.node.locked{cursor:not-allowed}
.node.open:hover>circle:not(.pulse){filter:brightness(1.08)}
.coupon .code{font-family:ui-monospace,Menlo,monospace;font-weight:900;font-size:1.25rem;letter-spacing:.15em;padding:8px 10px;border:2px dashed var(--accent);border-radius:8px;color:var(--accent2)}
body.scifi .coupon .code{color:var(--accent)}
.coupon.used{opacity:.55}
details.teacher{border:1px dashed var(--line);border-radius:12px;padding:10px 12px}
details.teacher summary{cursor:pointer}
table.ped input{width:100%;font:inherit;font-size:.8rem;padding:4px;border:1px solid var(--line);border-radius:6px;background:rgba(255,255,255,.6);color:#111}
body.scifi table.ped input{background:#0a1128;color:var(--ink)}
.stage{position:relative;height:200px;border-radius:12px;overflow:hidden;margin:8px 0 10px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.stage svg.bg{position:absolute;inset:0;width:100%;height:100%}

<script>
/* ================= ENGINE (téma-független) ================= */
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){const t=a%b;a=b;b=t}return a||1}
class Q{
  constructor(n,d=1){if(d<0){n=-n;d=-d}const g=gcd(n,d);this.n=n/g;this.d=d/g}
  add(o){return new Q(this.n*o.d+o.n*this.d,this.d*o.d)}
  mul(o){return new Q(this.n*o.n,this.d*o.d)}
  neg(){return new Q(-this.n,this.d)}
  eq(o){return this.n===o.n&&this.d===o.d}
  get zero(){return this.n===0}
  static parseDec(s){ // "12.75" -> Q
    if(!/^\d*\.?\d*$/.test(s)||s===''||s==='.')return null;
    const [i,f='']=s.split('.');return new Q(parseInt((i||'0')+f,10),Math.pow(10,f.length));
  }
}
const rint=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

function combine(terms){ // [{c:Q,k:'ab'}] -> Map(k->Q), zeros removed, stable order
  const m=new Map();
  for(const t of terms){m.set(t.k,(m.get(t.k)||new Q(0)).add(t.c))}
  for(const [k,v] of [...m])if(v.zero)m.delete(k);
  return m;
}
const mapToTerms=m=>[...m].map(([k,c])=>({c,k})).sort((a,b)=>(a.k===''?1:0)-(b.k===''?1:0));

/* --- formázás --- */
function decStr(q){ // véges tizedes tört? -> "2,5", különben null
  let d=q.d,p=0;while(d%2===0){d/=2;p++}let r=0;while(d%5===0){d/=5;r++}
  if(d!==1)return null;const k=Math.max(p,r);if(k>3)return null;
  const v=Math.abs(q.n)/q.d;return v.toFixed(k).replace('.',',');
}
function absHTML(q,preferFrac){
  const a=new Q(Math.abs(q.n),q.d);
  if(a.d===1)return String(a.n);
  const ds=decStr(a);
  if(ds&&!preferFrac)return ds;
  return `<span class="frac"><span>${a.n}</span><span>${a.d}</span></span>`;
}
function numHTML(q,preferFrac){return (q.n<0?'−':'')+absHTML(q,preferFrac)}
function letters(k){return k.split('').map(ch=>`<i>${ch}</i>`).join('')}
function termHTML(t,first){
  const neg=t.c.n<0;const a=new Q(Math.abs(t.c.n),t.c.d);
  const coef=(t.k&&a.n===1&&a.d===1)?'':absHTML(a);
  const sign=first?(neg?'−':''):(neg?' − ':' + ');
  return sign+coef+letters(t.k);
}
function exprHTML(terms,groupOf){
  if(!terms.length)return '0';
  return terms.map((t,i)=>{const h=termHTML(t,i===0);
    if(!groupOf)return h;const g=groupOf(t.k);
    // a jelet ne színezzük, csak a tagot
    const m=h.match(/^(\s*[+−]?\s*)(.*)$/);return `${m[1]}<span class="g${g}">${m[2]}</span>`}).join('');
}

/* --- generátorok --- */
const VARSETS2=[['a','b'],['x','y'],['m','n'],['p','q']];
const VARSETS3=[['a','b','c'],['x','y','z'],['p','q','r']];
function mk(c,k){return {c:c instanceof Q?c:new Q(c),k}}

function genL1(){
  for(;;){
    const [u,v]=pick(VARSETS2);
    const keys=shuffle([u,u,v,'',pick([v,'',u])]).slice(0,rint(4,5));
    if(keys.filter(k=>k===u).length<2)continue;
    const terms=keys.map((k,i)=>mk((i>0&&Math.random()<.3?-1:1)*rint(1,9),k));
    const m=combine(terms);
    if(m.size<2||m.size===terms.length)continue;
    if([...m.values()].some(q=>q.n<0)&&Math.random()<.5)continue; // L1: többnyire pozitív eredmény
    return {level:1,vars:[u,v],terms,target:m};
  }
}
function genL2(){
  for(;;){
    const vs=pick(VARSETS3);const prod=[vs[0],vs[1]].sort().join('');
    const pool=shuffle([vs[0],vs[1],vs[2],prod,'']).slice(0,rint(3,4));
    let keys=[];pool.forEach(k=>{keys.push(k,k)});if(Math.random()<.5)keys.push(pick(pool));
    keys=shuffle(keys);
    const terms=keys.map((k,i)=>mk((Math.random()<.45?-1:1)*rint(1,12),k));
    if(Math.random()<.45){const t=pick(terms);t.c=t.c.add(new Q(t.c.n<0?-1:1,2))} // egy tizedes együttható
    if(Math.random()<.3){ // kieső tag
      const k=pick(pool);const idx=terms.map((t,i)=>t.k===k?i:-1).filter(i=>i>=0);
      if(idx.length===2){terms[idx[1]].c=terms[idx[0]].c.neg()}
    }
    const m=combine(terms);if(m.size<2)continue;
    return {level:2,vars:vs,terms,target:m};
  }
}
const VALS_INT=[-5,-4,-3,-2,-1,1,2,3,4,5].map(n=>new Q(n));
const VALS_DEC=[[1,2],[-1,2],[3,2],[-3,2],[5,2],[1,5],[-1,5],[3,10]].map(([n,d])=>new Q(n,d));
const VALS_FR=[[1,2],[-1,2],[1,3],[-1,3],[2,3],[1,4],[-1,4],[2,5]].map(([n,d])=>new Q(n,d));
function genL3(){
  for(;;){
    const [u,v]=pick(VARSETS2);const prod=[u,v].sort().join('');
    const withProd=Math.random()<.45;
    const pool=withProd?[u,v,prod]:[u,v,''];
    let keys=[];pool.forEach(k=>keys.push(k,k));keys=shuffle(keys).slice(0,rint(5,6));
    const terms=keys.map((k,i)=>mk((Math.random()<.4?-1:1)*rint(1,9),k));
    const m=combine(terms);if(m.size<2)continue;
    const mode=pick(['int','int','dec','frac']);
    const vu=pick(VALS_INT);
    const vv=mode==='int'?pick(VALS_INT):mode==='dec'?pick(VALS_DEC):pick(VALS_FR);
    const vals={[u]:vu,[v]:vv};
    const value=evalMap(m,vals);
    if(value.d>12||Math.abs(value.n/value.d)>200)continue;
    return {level:3,vars:[u,v],terms,target:m,vals,value,preferFrac:mode==='frac'};
  }
}
function evalMap(m,vals){let s=new Q(0);for(const [k,c] of m){let p=c;for(const ch of k)p=p.mul(vals[ch]);s=s.add(p)}return s}

/* --- válasz-értelmezés --- */
function norm(s){return s.replace(/[−–]/g,'-').replace(/[·*×\s]/g,'').replace(/,/g,'.').toLowerCase()}
function parseExpr(raw,allowed){ // -> {terms} vagy {err}
  const s=norm(raw);if(!s)return {err:'Üres a válasz.'};
  if(/[()]/.test(s))return {err:'Zárójel nélkül írd be.'};
  const parts=s.match(/[+-]?[^+-]+/g);
  if(!parts||parts.join('')!==s)return {err:'Ezt nem tudom értelmezni. Pl.: 5a − 3b + 2'};
  const terms=[];
  for(const p of parts){
    const m=p.match(/^([+-]?)(\d*\.?\d*)(?:\/(\d+))?([a-z]*)$/);
    if(!m)return {err:`Ezt a tagot nem értem: „${p}”.`};
    const [,sg,num,den,lt]=m;
    if(!num&&den)return {err:`Ezt a tagot nem értem: „${p}”.`};
    if(!num&&!lt)return {err:`Ezt a tagot nem értem: „${p}”.`};
    for(const ch of lt)if(!allowed.includes(ch))return {err:`A(z) „${ch}” betű nem szerepel a feladatban.`};
    const sorted=lt.split('').sort().join('');
    if(/(.)\1/.test(sorted))return {err:'Hatványt (pl. aa) most nem kérünk – nézd meg újra a tagokat.'};
    let c=num?Q.parseDec(num):new Q(1);if(!c)return {err:`Ezt a számot nem értem: „${num}”.`};
    if(den){if(+den===0)return {err:'Nullával nem osztunk.'};c=c.mul(new Q(1,+den))}
    if(sg==='-')c=c.neg();
    terms.push({c,k:sorted});
  }
  return {terms};
}
function parseNum(raw){
  const s=norm(raw);const m=s.match(/^([+-]?)(\d*\.?\d*)(?:\/(\d+))?$/);
  if(!m||!m[2])return null;let q=Q.parseDec(m[2]);if(!q)return null;
  if(m[3]){if(+m[3]===0)return null;q=q.mul(new Q(1,+m[3]))}
  return m[1]==='-'?q.neg():q;
}

/* --- ellenőrzés + hibatípus --- */
function checkSimplify(task,raw){
  const allowed=[...new Set(task.terms.map(t=>t.k).join(''))];
  const p=parseExpr(raw,allowed);if(p.err)return {status:'invalid',msg:p.err};
  const S=combine(p.terms),T=task.target;
  const same=S.size===T.size&&[...T].every(([k,c])=>S.has(k)&&S.get(k).eq(c));
  if(same){
    const keys=p.terms.map(t=>t.k);
    const dup=keys.length!==new Set(keys).size;const zero=p.terms.some(t=>t.c.zero);
    if(dup||zero)return {status:'unsimplified',msg:zero?'Jó az érték, de a 0-s tagot nem kell kiírni.':'Ugyanannyit ér, de még van összevonható tag.'};
    return {status:'correct'};
  }
  const extra=[...S.keys()].filter(k=>!T.has(k)),missing=[...T.keys()].filter(k=>!S.has(k));
  if(extra.length&&missing.length)return {status:'wrong',err:'Különnemű tagok összevonása',explain:'Csak az azonos betűrészű tagok vonhatók össze (pl. <i>a</i> és <i>ab</i> nem).'};
  if(missing.length){
    const merged=[...S].some(([k,c])=>T.has(k)&&missing.some(mk=>c.eq(T.get(k).add(T.get(mk)))));
    if(merged)return {status:'wrong',err:'Különnemű tagok összevonása',explain:'Csak az azonos betűrészű tagok vonhatók össze (pl. <i>a</i> és <i>ab</i>, vagy <i>a</i> és a szám tag nem).'};
    return {status:'wrong',err:'Kimaradt tag',explain:'Valamelyik tag kimaradt a végeredményből.'};
  }
  if(extra.length)return {status:'wrong',err:'Fölösleges tag',explain:'Olyan tag van a válaszban, ami az összevonás után kiesik (0 lesz) vagy nincs is a feladatban.'};
  const wrongKeys=[...T.keys()].filter(k=>!S.get(k).eq(T.get(k)));
  const nm=k=>k?`${'aeioufflmnrsxy'.includes(k[0])?'az':'a'} <i>${k}</i>-s tagoknál`:'a szám tagoknál';
  const list=ks=>ks.map(nm).join(' és ');
  const signKeys=wrongKeys.filter(k=>S.get(k).eq(T.get(k).neg()));
  if(signKeys.length)return {status:'wrong',err:'Előjelhiba',explain:`Az előjel csúszott el ${list(signKeys)}. Nézd meg újra, melyik tag előtt áll mínusz!`};
  if(wrongKeys.every(k=>k===''))return {status:'wrong',err:'Számolási hiba (szám tag)',explain:'A betű nélküli tagok összevonásánál csúszott el.'};
  return {status:'wrong',err:'Számolási hiba (együttható)',explain:`Az együttható nem stimmel ${list(wrongKeys)}. Add össze újra az előjeles együtthatókat!`};
}
function checkValue(task,raw){
  const q=parseNum(raw);
  if(!q){
    if(/[a-z]/i.test(raw))return {status:'invalid',msg:'Itt egy számot várok: a kifejezés értékét. Tört is jó, pl. 25/6.'};
    return {status:'invalid',msg:'Ezt a számot nem értem. Tizedesvessző és tört (pl. −7/2) is jó.'};
  }
  if(q.eq(task.value))return {status:'correct'};
  for(const ch of task.vars){const alt={...task.vals,[ch]:task.vals[ch].neg()};
    if(q.eq(evalMap(task.target,alt)))return {status:'wrong',err:'Előjelhiba behelyettesítéskor',explain:`Úgy számoltál, mintha <i>${ch}</i> ellentétes előjelű lenne. Negatív számot zárójelben helyettesíts be!`}}
  if(q.eq(task.value.neg()))return {status:'wrong',err:'Előjelhiba a végeredményben',explain:'Az érték nagysága jó, csak az előjele nem.'};
  const orig=task.terms.reduce((s,t)=>{let p=t.c;for(const ch of t.k)p=p.mul(task.vals[ch]);return s.add(p)},new Q(0));
  return {status:'wrong',err:'Számolási hiba',explain:'Először vond össze, és csak utána helyettesíts – úgy kevesebb a számolás.'};
}


function checkL3(task,rawE,rawV){
  // 1) összevont alak
  const se=checkSimplify(task,rawE);
  if(se.status==='invalid')return {status:'invalid',msg:'1. lépés: '+se.msg};
  if(se.status==='unsimplified')return {status:'unsimplified',msg:'1. lépés: '+se.msg};
  // 2) érték
  const q=parseNum(rawV);
  if(!q)return {status:'invalid',msg:/[a-z]/i.test(rawV)?'2. lépés: itt egy számot várok – a kifejezés értékét. Tört is jó, pl. 25/6.':'2. lépés: '+(rawV.trim()?'ezt a számot nem értem. Tizedesvessző és tört (pl. −7/2) is jó.':'írd be a helyettesítési értéket is!')};
  const eOk=se.status==='correct';
  const own=combine(parseExpr(rawE,[...new Set(task.terms.map(t=>t.k).join(''))]).terms);
  const vOwn=evalMap(own,task.vals);
  const vOk=q.eq(task.value)||q.eq(vOwn);           // továbbvitt hiba: a saját kifejezésébe jól helyettesített
  let vErr=null;
  if(!vOk){
    const m=eOk?task.target:own;
    vErr={err:'Számolási hiba',explain:'A behelyettesítés vagy a számolás nem stimmel.'};
    for(const ch of task.vars){const alt={...task.vals,[ch]:task.vals[ch].neg()};
      if(q.eq(evalMap(m,alt))){vErr={err:'Előjelhiba behelyettesítéskor',explain:`Úgy számoltál, mintha <i>${ch}</i> ellentétes előjelű lenne. Negatív számot zárójelben helyettesíts be!`};break}}
    if(vErr.err==='Számolási hiba'&&q.eq((eOk?task.value:vOwn).neg()))vErr={err:'Előjelhiba a végeredményben',explain:'Az érték nagysága jó, csak az előjele nem.'};
  }
  const status=eOk&&vOk?'correct':(eOk||vOk)?'partial':'wrong';
  const err=!eOk?se.err:vErr?vErr.err:'';
  return {status,eOk,vOk,eErr:eOk?null:se,vErr,follow:!eOk&&vOk,err};
}
function l3Report(r){
  const ok='✔',no='✘';
  const a=r.eOk?`${ok} <b>Összevonás:</b> jó.`:`${no} <b>Összevonás – ${r.eErr.err}.</b> ${r.eErr.explain}`;
  const b=r.vOk?`${ok} <b>Behelyettesítés és számolás:</b> jó${r.follow?' – a saját kifejezésedbe jól helyettesítettél, ezért ez a rész jár.':'.'}`
               :`${no} <b>Behelyettesítés – ${r.vErr.err}.</b> ${r.vErr.explain}`;
  return a+'<br>'+b;
}

function onCheck(e){
  e.preventDefault();const t=cur();if(!t||t.done)return;
  const raw=$('ans').value;t.input=raw;const raw2=$('ans2').value;t.input2=raw2;
  const r=t.level<3?checkSimplify(t,raw):checkL3(t,raw,raw2);
  if(r.status==='invalid'){t.fb={cls:'info',html:r.msg};renderTask();return}
  if(r.status==='unsimplified'){t.fb={cls:'info',html:r.msg+' Folytasd!'};renderTask();return}
  t.done=true;
  const entry={ans:(t.level<3?raw:raw+' → '+raw2).replace(/</g,'&lt;'),ok:r.status==='correct',err:r.status==='partial'?'Részben jó'+(r.err?': '+r.err:''):r.err,hint:t.hint};
  if(S.mode==='practice')practiceResult(t,r,entry);else battleResult(t,r,entry);
  S.log.push(entry);render();
  if(S.mode==='practice')$('nextBtn').focus();
}
function practiceResult(t,r,entry){
  const th=T();entry.where=`Gyak. ${t.level}`;
  if(r.status==='correct'){
    const f=decay(t.level)*HINT_F[t.hint];
    const g=Math.round(BASE[t.level]*f*goldMul()),x=Math.round(XPB[t.level]*f*xpMul(t.level));
    S.gold+=g;S.miss=0;entry.gain=`+${g}`;const healed=healHP(HEAL_OK*(S.cls==='gyogyito'?2:1));
    t.fb={cls:'ok',html:`<b class="big">${pick(th.ok)}</b> +${g} ${th.cur}, +${x} XP${t.hint?` (${t.hint===1?'fél':'negyed'} jutalom a segítség miatt)`:''}${healed?` · <b>+${healed} HP</b>${S.hp>=hpMax()?' (teljesen felgyógyultál)':''}`:''}`};
    if(!t.hint)S.streak++;
    if(S.streak>=upNeed()){S.streak=0;
      if(S.level<3){S.level++;if(S.level>S.max){S.max=S.level;banner(th.up(th.tiers[S.level-1]))}else banner(th.back(th.tiers[S.level-1]))}
      else if(S.max<3){S.max=3;banner(`${th.tiers[2]} fokozat teljesítve – most már bármelyik bossnak nekimehetsz!`)}}
    addXP(x);
  }else if(r.status==='partial'){
    const f=.5*decay(t.level)*HINT_F[t.hint];
    const g=Math.round(BASE[t.level]*f*goldMul()),x=Math.round(XPB[t.level]*f*xpMul(t.level));
    S.gold+=g;addXP(x);S.streak=0;entry.gain=`+${g}`;
    const healed=healHP(HEAL_PART*(S.cls==='gyogyito'?2:1));
    t.fb={cls:'info',html:`<b class="big">Részben jó – fél jutalom.</b> +${g} ${th.cur}, +${x} XP${healed?`, +${healed} HP`:''}<br>${l3Report(r)}<br>${solutionHTML(t)}`};
  }else{
    S.streak=0;S.miss++;entry.gain='';
    t.fb={cls:'bad',html:t.level===3?`${l3Report(r)}<br>${solutionHTML(t)}`:`<b>${r.err}.</b> ${r.explain}<br>${solutionHTML(t)}`};
    if(S.miss>=DOWN){S.miss=0;if(S.level>1){S.level--;banner(th.down(th.tiers[S.level-1],S.level<S.max))}}
  }
}
function battleResult(t,r,entry){

    let dmg=isTrial?ATK[t.level]:Math.round(ATK[t.level]*(1+arenaBonus())*(S.cls==='magus'&&t.level===3?1.3:1));
    if(!isTrial&&t.level===1)dmg=Math.max(0,Math.min(dmg,b.ehp-armorLine(b)));
    let crit=false;if(!isTrial&&t.level===3&&Math.random()<critChance()){dmg*=2;crit=true}
    b.ehp-=dmg;S.anim={who:'e',txt:`−${dmg}${crit?'!':''}`};entry.gain=`−${dmg} HP${crit?' (krit.)':''}`;
    const x=Math.round(XPB[t.level]*xpMul(t.level));addXP(x);
    b.cstreak=(b.cstreak||0)+1;let healMsg='';if(!isTrial&&S.cls==='gyogyito'&&b.cstreak%3===0&&b.php<b.pmax){const h=Math.min(15,b.pmax-b.php);b.php+=h;healMsg=`<br><b>Gyógyító erő: +${h} életerő (3 jó egymás után)!</b>`}
    t.fb={cls:'ok',html:`${crit?'<b class="big crit">⚡ KRITIKUS TALÁLAT – dupla sebzés!</b><br>':''}<b class="big">${pick(th.ok)}</b> ${th.attacks[t.level-1]}: −${dmg} életerő az ellenfélnek · +${x} XP${!isTrial&&t.level===1&&b.ehp<=armorLine(b)?`<br><b>${th.armor}</b>`:''}${healMsg}`};
  }else if(r.status==='partial'){
    const dmg=Math.round((isTrial?ATK[t.level]:ATK[t.level]*(1+arenaBonus())*(S.cls==='magus'&&t.level===3?1.3:1))/2);
    b.cstreak=0;const hit=Math.round(b.hit/2);b.ehp-=dmg;b.php-=hit;S.anim={who:'e',txt:`−${dmg}`};entry.gain=`−${dmg} / −${hit}`;
    const x=Math.round(XPB[t.level]/2*xpMul(t.level));addXP(x);
    t.fb={cls:'info',html:`<b class="big">Részben talált!</b> Fél sebzés: −${dmg} az ellenfélnek · +${x} XP<br>${l3Report(r)}<br>${solutionHTML(t)}<br><b>${b.name} gyengén visszaüt: −${hit} életerő.</b>`};
  }else{
    b.cstreak=0;const shield=!isTrial&&S.cls==='harcos'&&!b.shieldUsed;if(shield)b.shieldUsed=true;
    b.php-=shield?0:b.hit;S.anim={who:'p',txt:shield?'🛡️':`−${b.hit}`};entry.gain=shield?'pajzs':`−${b.hit} neked`;
    t.fb={cls:'bad',html:`${t.level===3?l3Report(r):`<b>${r.err}.</b> ${r.explain}`}<br>${solutionHTML(t)}<br><b>${shield?`${b.name} visszaütne, de a pajzsod felfogta! (Harconként egyszer.)`:`${b.name} visszaüt: −${b.hit} életerő.`}</b>`};
  }
  if(r.status!=='correct'){b.errs=b.errs||{};const k=r.err||'Hiba';b.errs[k]=(b.errs[k]||0)+1;b.errTiers=b.errTiers||{};b.errTiers[t.level]=(b.errTiers[t.level]||0)+1}
  if(b.kind==='arena')S.hp=Math.max(0,b.php);
  if(b.ehp<=0)endBattle(true);else if(b.php<=0)endBattle(false);
}

function onHint(){
  const t=cur();if(!t||t.done||t.hint>=2)return;t.hint++;
  const keys=[...new Set(t.terms.map(x=>x.k))];const g=k=>keys.indexOf(k)%5;
  const groups=keys.map(k=>`<span class="g${g(k)}">${k?letters(k)+'-s':'szám'}</span>`).join(', ');
  let h=`<b>1. segítség:</b> Az azonos színűek tartoznak össze, mert azok <b>egyneműek</b> (${groups} tagok):<div class="expr" style="font-size:1.3rem;margin:6px 0">${exprHTML(t.terms,g)}</div>`;
  if(t.hint>=2){
    if(t.level<3){
      const pieces=keys.map(k=>{const gt=t.terms.filter(x=>x.k===k);const e=exprHTML(gt);
        const inner=gt.length>1?`(${e})`:e;return `<span class="g${g(k)}">${inner}</span>`});
      const joined=pieces.map((p,i)=>{if(i===0)return p;const neg=/^<span class="g\d">−/.test(p);return neg?' − '+p.replace(/^(<span class="g\d">)−/,'$1'):' + '+p}).join('');
      h+=`<b>2. segítség:</b> Csoportosítva:<div class="expr" style="font-size:1.3rem;margin:6px 0">${joined}</div>Most vond össze a zárójeleken belül!<br>`;
    }else{
      const sub=mapToTerms(t.target).map((x,i)=>{
        const neg=x.c.n<0,a=new Q(Math.abs(x.c.n),x.c.d);
        const vals=x.k.split('').map(ch=>{const v=t.vals[ch];const s=numHTML(v,t.preferFrac);return (v.n<0)?`(${s})`:s});
        let body;
        if(!x.k)body=absHTML(a);
        else if(a.n===1&&a.d===1)body=vals.join('·');
        else body=[absHTML(a),...vals].join('·');
        if(i===0)return (neg?'−':'')+(neg&&x.k&&a.n===1&&a.d===1?'':'')+body;
        return (neg?' − ':' + ')+body}).join('');
      h+=`<b>2. segítség:</b> Összevonva: <b>${exprHTML(mapToTerms(t.target))}</b><br>Behelyettesítve:<div class="expr" style="font-size:1.3rem;margin:6px 0">${sub}</div>Ezt számold ki!<br>`;
    }
  }
  h+=`<span class="tiny">${t.hint===1?'Jó válasz most fél jutalmat ér. Ha kell, kérhetsz még egy segítséget (akkor negyedet ér).':'Jó válasz most a jutalom negyedét éri.'} Segítséggel a válasz nem számít a sorozatba.</span>`;
  t.fb={cls:'info',html:h};
  renderTask();
}

const ftree=(x,y,s=1,c='#5f9a4e')=>`<rect x="${x-1.6*s}" y="${y}" width="${3.2*s}" height="${7*s}" fill="#6b4b2a"/><circle cx="${x}" cy="${y-4*s}" r="${8*s}" fill="${shade(c,-.15)}"/><circle cx="${x-2*s}" cy="${y-6*s}" r="${6*s}" fill="${c}"/><circle cx="${x-4*s}" cy="${y-9*s}" r="${2.5*s}" fill="#fff" opacity=".15"/>`;
const fmtn=(x,y,s)=>`<path d="M${x-36*s} ${y} L${x} ${y-50*s} L${x+36*s} ${y}Z" fill="#b5a385"/><path d="M${x} ${y-50*s} L${x+36*s} ${y} L${x+6*s} ${y}Z" fill="#8c7b5e"/><path d="M${x-11*s} ${y-35*s} L${x} ${y-50*s} L${x+11*s} ${y-35*s} L${x+4*s} ${y-38*s} L${x-3*s} ${y-33*s}Z" fill="#fff"/>`;
const fhouse=(x,y,c='#b3362b')=>`<rect x="${x-8}" y="${y-8}" width="16" height="12" fill="#f3e3c0" stroke="#7a5410" stroke-width=".8"/><path d="M${x-10} ${y-7} L${x} ${y-16} L${x+10} ${y-7}Z" fill="${c}" stroke="#5a1d14" stroke-width=".8"/><rect x="${x-2}" y="${y-3}" width="4" height="7" fill="#7a5410"/>`;
const cloud=(x,y,s=1,o=.9)=>`<g opacity="${o}"><ellipse cx="${x}" cy="${y}" rx="${34*s}" ry="${12*s}" fill="#fff"/><ellipse cx="${x-14*s}" cy="${y-8*s}" rx="${16*s}" ry="${12*s}" fill="#fff"/><ellipse cx="${x+10*s}" cy="${y-12*s}" rx="${18*s}" ry="${14*s}" fill="#fff"/></g>`;
function starsField(n,w,h,seed=7){let sd=seed;const rnd=()=>(sd=(sd*9301+49297)%233280)/233280;
  return Array.from({length:n},()=>{const x=(rnd()*w).toFixed(1),y=(rnd()*h).toFixed(1),r=rnd();
    return r>.96?`<path d="M${x} ${y-4} L${+x+1} ${+y-1} L${+x+4} ${y} L${+x+1} ${+y+1} L${x} ${+y+4} L${x-1} ${+y+1} L${x-4} ${y} L${x-1} ${y-1}Z" fill="#fff" opacity=".9"/>`
      :`<circle cx="${x}" cy="${y}" r="${(r*1.5+.3).toFixed(2)}" fill="#fff" opacity="${(rnd()*.6+.3).toFixed(2)}"/>`}).join('')}

  return `<svg viewBox="0 0 200 260" class="av hero-img hero-${o.cls}"><defs><radialGradient id="hiA${o.cls}"><stop offset="0" stop-color="${glow}" stop-opacity=".55"/><stop offset="1" stop-color="${glow}" stop-opacity="0"/></radialGradient></defs>
   ${o.weapon?`<ellipse cx="100" cy="135" rx="92" ry="120" fill="url(#hiA${o.cls})"><animate attributeName="opacity" values=".6;1;.6" dur="2.4s" repeatCount="indefinite"/></ellipse>`:''}
   <ellipse cx="100" cy="252" rx="60" ry="7" fill="#000" opacity=".28"/>
   <image href="${src}" x="17" y="0" width="166" height="257" preserveAspectRatio="xMidYMax meet"/>
   ${o.hat?sparkle(62,30,7,'#ffe9a6',1.6)+sparkle(140,22,6,'#ffe9a6',2.1)+sparkle(100,6,5,'#fff6c4',1.2):''}
   ${o.pet?(f?F_DEFS:S_DEFS)+heroPet(f):''}</svg>`;

function heroSVG(theme,o){
  const g=o.g||(typeof S!=='undefined'&&S.gender)||'f',src=typeof HERO_IMG!=='undefined'&&HERO_IMG[`${o.cls}_${theme}_${g}`];
  if(src)return heroImgSVG(theme,o,src);
  const f=theme==='fantasy';
  const body=f?({harcos:heroHarcos,magus:heroMagus,gyogyito:heroGyogyito}[o.cls]):({harcos:heroPancelos,magus:heroTuzer,gyogyito:heroMernok}[o.cls]);
  let svg=body(o);
  if(!f)svg=svg.replace(/(id="|url\(#)x([A-Z]\w*)/g,`$1x${o.cls}$2`);
  return `<svg viewBox="0 0 200 260" class="av hero-${o.cls}">${o.pet?(f?F_DEFS:S_DEFS):''}${svg}</svg>`;
}

BG_IMG.fantasy_falu='img-5b29cc0e90.webp';

/* ================= FALU: kezdőképernyő, ahol a hős épületről épületre sétál ================= */
function EQ(){const e=S.eq||{};return{weapon:!!S.owned.weapon&&e.weapon!==false,hat:!!S.owned.hat&&e.hat!==false,pet:!!S.owned.pet&&e.pet!==false}}
const faluOK=()=>S.theme==='fantasy'&&typeof BG_IMG!=='undefined'&&!!BG_IMG.fantasy_falu;
const FW=2576,FH=1438,FP=(x,y)=>[x/FW*100,y/FH*100];
const FPLAZA=FP(1210,1000);
const FALU=[
 {k:'gyak',m:'practice',ic:'📖',name:'Mágusiskola',fn:'Gyakorlás',key:'1',rect:[200,20,810,620],lbl:FP(500,110),door:FP(700,615),path:[FP(1000,760),FP(860,650)]},
 {k:'arena',m:'arena',ic:'⚔️',name:'Kolosszeum',fn:'Aréna',key:'2',rect:[1060,30,1600,470],lbl:FP(1330,40),door:FP(1270,470),path:[FP(1240,640)]},
 {k:'proba',m:'trial',ic:'🗝️',name:'Sötét torony',fn:'Próba',key:'3',rect:[1700,0,2060,610],lbl:FP(1880,50),door:FP(1820,610),path:[FP(1450,700),FP(1640,640)]},
 {k:'terkep',m:'map',ic:'🧭',name:'Városkapu',fn:'Térkép',key:'4',rect:[2180,330,2576,830],lbl:FP(2360,360),door:FP(2330,760),path:[FP(1500,780),FP(1900,770)]},
 {k:'bolt',m:'shop',ic:'🧪',name:'Alkimista bolt',fn:'Bolt',key:'5',rect:[280,720,960,1300],lbl:FP(560,760),door:FP(820,1215),path:[FP(1000,960),FP(930,1150)]},
 {k:'cehaz',m:'shop',priv:true,ic:'📜',name:'Céhház',fn:'Kiváltságok',key:'6',rect:[1550,690,2160,1330],lbl:FP(1880,720),door:FP(1650,1270),path:[FP(1290,1060),FP(1430,1250)]},
];
let fPos=null,fBusy=false,fClsAsked=false;
function faluBadge(k){
  if(k==='cehaz'){const n=S.coupons.filter(c=>!c.done).length;return n?String(n):''}
  if(k==='gyak'&&exhausted())return '❤';
  return '';
}
function faluHTML(){
  return `<div class="fwrap" id="fwrap"><div class="falu" id="falu"><img class="fmap" src="${BG_IMG.fantasy_falu}" alt="A falu" draggable="false">
   ${FALU.map(b=>{const [x0,y0,x1,y1]=b.rect,bd=faluBadge(b.k);return `<button class="fbld" data-fb="${b.k}" aria-label="${b.fn}: ${b.name}" style="left:${x0/FW*100}%;top:${y0/FH*100}%;width:${(x1-x0)/FW*100}%;height:${(y1-y0)/FH*100}%"></button>
   <div class="flbl ${bd?'badge':''}" data-bd="${bd}" id="fl-${b.k}" style="left:${b.lbl[0]}%;top:${b.lbl[1]}%"><i>${b.ic}</i><span>${b.fn}<small>${b.name}</small></span></div>`}).join('')}
   <div class="fwalker" id="fhero" title="A hősöd – kattints rá!"><span class="fme">${CL()?clsName():T().hero} · ${S.clvl}. szint</span><div class="finner" id="fheroIn">${avatarSVG(S.theme,{...EQ(),cls:S.cls})}</div></div>
  </div></div>
  <div class="fquick"><button data-fq="hos"><b>🧝</b>Hős<kbd>H</kbd></button>${FALU.map(b=>`<button data-fq="${b.k}"><b>${b.ic}</b>${b.fn}<kbd>${b.key}</kbd></button>`).join('')}</div>`;
}
function fPlace(p){const h=$('fhero');if(!h)return;h.style.left=p[0]+'%';h.style.top=p[1]+'%';h.style.zIndex=Math.round(p[1]*10)}
function faluAfter(){
  if(S.mode!=='falu')return;
  fBusy=false;
  const last=FALU.find(b=>b.k===S.fLast);fPos=last?[...last.door]:[...FPLAZA];fPlace(fPos);
  const w=$('fwrap');if(w&&w.scrollWidth>w.clientWidth)w.scrollLeft=(w.scrollWidth-w.clientWidth)*0.47;
  if(!S.cls&&!fClsAsked&&typeof classChooser==='function'){fClsAsked=true;classChooser()}
}
function fToast(t){const f=$('falu');if(!f)return;const e=document.createElement('div');e.className='ftoast';e.textContent=t;f.appendChild(e);setTimeout(()=>e.remove(),1500)}
function fWalk(pts,done){
  const h=$('fhero'),inn=$('fheroIn');fBusy=true;h.classList.add('moving');
  const segs=[];let a=fPos;pts.forEach(b=>{segs.push([a,b]);a=b});
  const SP=55;let i=0,t0=null;
  const step=ts=>{
    if(!$('fhero')){fBusy=false;return}
    if(i>=segs.length){h.classList.remove('moving');inn.style.transform='';fBusy=false;done&&done();return}
    const [p,q]=segs[i],dx=q[0]-p[0],dy=(q[1]-p[1])*FH/FW,dur=Math.max(.08,Math.hypot(dx,dy)/SP)*1000;
    if(t0===null){t0=ts;if(dx<-.1)h.classList.add('flip');else if(dx>.1)h.classList.remove('flip')}
    const k=Math.min(1,(ts-t0)/dur);fPos=[p[0]+dx*k,p[1]+(q[1]-p[1])*k];fPlace(fPos);
    const s=Math.sin(ts/1000*14);inn.style.transform=`${h.classList.contains('flip')?'scaleX(-1) ':''}translateY(${-Math.abs(s)*3}%) rotate(${s*2}deg)`;
    if(k>=1){i++;t0=null}requestAnimationFrame(step)};
  requestAnimationFrame(step);
}
function fEnter(b){
  S.fLast=b.k;S.battle=null;S.mode=b.m;$('banner').className='banner';render();
  if(b.m==='practice'){focusAns();if(!S.cls&&typeof classChooser==='function')classChooser()}
  if(b.priv){const a=$('privAnchor');if(a)a.scrollIntoView({behavior:'smooth',block:'start'})}
  else window.scrollTo({top:0,behavior:'smooth'});
}
function fGo(k,quick){
  if(fBusy)return;if(k==='hos'){heroPanel();return}
  const b=FALU.find(x=>x.k===k);if(!b)return;
  if(quick||Math.hypot(fPos[0]-b.door[0],fPos[1]-b.door[1])<1){fEnter(b);return}
  document.querySelectorAll('.flbl').forEach(l=>l.classList.toggle('hot',l.id==='fl-'+k));
  const atPlaza=Math.hypot(fPos[0]-FPLAZA[0],fPos[1]-FPLAZA[1])<1;
  fToast(`${b.name} felé…`);fWalk((atPlaza?[]:[FPLAZA]).concat(b.path,[b.door]),()=>fEnter(b));
}

function heroPanel(){
  const th=T(),c=CL(),eq=EQ();
  const bar=(lab,cls,v,m,txt)=>`<div class="hstat ${cls}"><span class="k">${lab}</span><div class="hbar"><i style="width:${Math.max(0,Math.min(100,v/m*100))}%"></i></div><span>${txt}</span></div>`;
  const slot=(k,label)=>{const [n]=th.items[k];
    if(!S.owned[k])return `<div class="hslot empty">${itemIcon(S.theme,k)}<div>${n}</div><div class="lb">${label} · ${PRICES[k]} ${th.cur}</div></div>`;
    return `<button class="hslot ${eq[k]?'on':''}" data-feq="${k}">${eq[k]?'<span class="tag">rajtad</span>':''}${itemIcon(S.theme,k)}<div>${n}</div><div class="lb">${label}</div></button>`};
  const open=S.coupons.filter(x=>!x.done);
  const tro=[...(S.beaten||[]).map(n=>`<span class="tro"><i>★</i>${n}</span>`),...S.grades.map(g=>`<span class="tro"><i>${g.grade}</i>${g.name}</span>`)];
  const html=`<div class="ovcard hpanel"><div class="hph"><h2>A hősöd</h2><button class="btn ghost" data-fclose>Vissza a faluba ✕</button></div>
   <div class="hgrid">
    <div>
     <div class="hcard"><div class="hwho"><div class="hlvl">${S.clvl}</div><div><b>${c?clsName():th.hero}</b><span>${S.clvl}. szint${c?'':' · még nincs osztályod'}</span></div></div>
      ${bar('HP','hp',S.hp,hpMax(),exhausted()?'kimerült':`${S.hp} / ${hpMax()}`)}
      ${bar('AP','ap',S.ap,apMax(),`${S.ap} / ${apMax()}`)}<div class="hnote">Tanítási naponként +${apDay()} AP</div>
      ${bar('XP','xp',S.xp,xpNeed(),`${S.xp} / ${xpNeed()}`)}<div class="hnote">Még ${xpNeed()-S.xp} XP a ${S.clvl+1}. szintig</div>
      <div class="hstat gp"><span class="k">GP</span><div></div><span>${S.gold} ${th.cur}</span></div></div>
     <div class="hcard"><h3>Képességek</h3>
      <div class="hkv"><span>Aréna-sebzés</span><b>+${Math.round(arenaBonus()*100)}%</b></div>
      <div class="hkv"><span>Legmagasabb fokozat</span><b>${S.max}. fokozat</b></div>
      <div class="hkv"><span>Jó válaszok sorozata</span><b>${S.streak}</b></div>
      ${c?`<div class="hperk">${c.perk}</div>`:''}
      <p style="margin:8px 0 0"><button class="btn ghost" data-act="cls-open" style="padding:4px 10px;font-size:.8rem">${c?'Osztályváltás':'Osztály választása'}</button></p></div>
     <div class="hcard">${evCardHTML()}</div>
    </div>
    <div class="hbig">${avatarSVG(S.theme,{...eq,cls:S.cls})}</div>
    <div>
     <div class="hcard"><h3>Felszerelés</h3><div class="hslots">${slot('weapon','Fegyver')}${slot('hat','Fejfedő')}${slot('pet','Társ')}</div>
      <div class="hnote" style="margin:6px 0 0">Kattints egy tárgyra: felveszed vagy leveszed. A fegyver csak felvéve sebez többet. A próbán egyik sem számít.</div></div>
     <div class="hcard"><h3>Táska</h3><div class="hbag"><div class="hcell" title="${th.items.potion[0]}">${itemIcon(S.theme,'potion')}<span class="n">×${S.potions}</span></div>${'<div class="hcell"></div>'.repeat(3)}</div></div>
     <div class="hcard"><h3>Kuponjaim</h3>${open.length?open.map(x=>`<div class="hcoupon">${privIcon(S.theme)}<div><b>${x.name}</b><span>${x.date} · a tanár váltja be</span></div><code>${x.code}</code></div>`).join(''):'<div class="hnote" style="margin:0">Még nincs beváltatlan kuponod. A Céhházban veheted meg AP-ért.</div>'}</div>
     <div class="hcard"><h3>Trófeák</h3><div class="htro">${tro.length?tro.join(''):'<span class="hnote" style="margin:0">Győzz le egy ellenfelet az Arénában!</span>'}</div></div>
    </div>
   </div></div>`;
  closeHeroPanel();document.body.insertAdjacentHTML('beforeend',`<div class="overlay show" id="hpov">${html}</div>`);
}
function closeHeroPanel(){const o=$('hpov');if(o)o.remove()}
document.addEventListener('click',e=>{
  if(e.target.closest('[data-act="cls-open"]'))closeHeroPanel();
  const t=e.target.closest('[data-fb],[data-fq],#fhero,[data-feq],[data-fclose],#hpov');if(!t)return;
  if(t.matches('[data-fclose]')||(t.id==='hpov'&&e.target===t)){closeHeroPanel();return}
  if(t.dataset.feq){S.eq=S.eq||{weapon:true,hat:true,pet:true};const k=t.dataset.feq;S.eq[k]=!EQ()[k];render();heroPanel();return}
  if(t.id==='fhero'){if(!fBusy)heroPanel();return}
  if(t.dataset.fb)fGo(t.dataset.fb);else if(t.dataset.fq)fGo(t.dataset.fq,true);
});
document.addEventListener('mouseover',e=>{const b=e.target.closest&&e.target.closest('[data-fb]');document.querySelectorAll('.flbl.hover').forEach(l=>l.classList.remove('hover'));if(b){const l=$('fl-'+b.dataset.fb);if(l)l.classList.add('hover')}});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeHeroPanel();return}
  if(S.mode!=='falu'||$('hpov')||document.querySelector('.overlay.show,.clsbox'))return;
  if(/^(INPUT|TEXTAREA)$/.test((document.activeElement||{}).tagName||''))return;
  const b=FALU.find(x=>x.key===e.key);if(b)fGo(b.k);else if(e.key==='h'||e.key==='H')heroPanel();
});

load();regenAP();applyDayBonus();regenHP();S.ptask=gen(S.level);render();focusAns();
