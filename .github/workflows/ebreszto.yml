# Kódfejtő Műhely – napi „ébresztő” a Supabase ingyenes projektjének.
# Az ingyenes projekt egy hét alacsony forgalom után elalszik (pl. a szünetekben).
# Ez a feladat naponta egyszer küld egy apró lekérdezést, hogy ébren maradjon.
# Az adatokat az assets/config.js-ből olvassa (ott a NYILVÁNOS kulcs van, ez rendben van).
# Kézzel is elindítható: GitHub → Actions → Supabase ébresztő → Run workflow.
name: Supabase ébresztő

on:
  schedule:
    - cron: '17 5 * * *'   # minden nap 5:17 UTC-kor
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping
        run: |
          URL=$(grep -oP "supabaseUrl:\s*'\K[^']+" assets/config.js || true)
          KEY=$(grep -oP "supabaseKey:\s*'\K[^']+" assets/config.js || true)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "A Supabase még nincs beállítva az assets/config.js-ben, nincs mit ébreszteni."
            exit 0
          fi
          curl -fsS -X POST "${URL%/}/rest/v1/rpc/kf_ping" \
            -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}'
          echo
